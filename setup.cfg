[flake8]
max-line-length = 120
extend-ignore = E203,W503,E101,W191
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist,node_modules

# Example of how to ignore specific files or patterns:
# Uncomment and modify the section below if needed
# per-file-ignores =
#     # Allow unused imports in __init__.py files
#     __init__.py: F401
#     # Ignore long lines in specific files
#     hms_tz/path/to/specific/file.py: E501
#     # Ignore specific error codes in specific directories
#     hms_tz/some/directory/*: E501,F841

[isort]
profile = black
line_length = 120
